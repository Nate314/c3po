# compose-launcher config for c3po (https://github.com/Nate314/c3po)
# c3po is a Discord bot and serves no HTTP port, but the launcher needs at least one
# port line. BOT_PORT is picked and written to .env like any other port, and
# docker-compose.yml does not publish it.
port BOT_PORT 8080

url c3po has no web page. Logs: ./run.ps1 logs -f bot   (needs DISCORD_TOKEN in .env)
